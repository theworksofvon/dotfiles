---
name: Shell — rebuild the tool init cache
command: rm -f ~/.cache/zsh-init/*.zsh && exec zsh
description: >
  zshrc caches the output of brew shellenv, mise activate, starship init,
  zoxide init and fzf --zsh, regenerating only when the binary's mtime is
  newer. Run this if a tool misbehaves after an upgrade that didn't move the
  binary — a reinstall in place, or a manually patched init script.
tags:
  - shell
shells:
  - zsh
