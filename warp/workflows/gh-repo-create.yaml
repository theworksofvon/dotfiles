---
name: gh — publish this repo to an org
command: gh repo create {{org}}/{{repo}} --{{visibility}} --source=. --remote=origin --push
description: >
  Creates the remote and pushes the current branch. Run it from inside the
  repo — the gh wrapper picks the account from the directory, so a repo under
  ~/costmine publishes as the work account without any switching.
tags:
  - gh
  - git
arguments:
  - name: org
    description: GitHub owner or org
    default_value: ""
  - name: repo
    description: Repository name
    default_value: ""
  - name: visibility
    description: private or public
    default_value: private
shells:
  - zsh
